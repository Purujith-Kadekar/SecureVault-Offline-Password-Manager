; ============================================================================
; SecureVault -- EdgeHax S3 Pro (ESP32-S3 N16R8) Password Manager
; Developed by Purujith Kadekar
; Build infra owned by Assistant A. App logic (include/ + src/) owned
; separately -- do not add app-specific build_flags here without checking
; with whoever owns main.cpp/ui_screens.cpp first, since flag mismatches
; between here and their assumptions (e.g. USB mode) will silently break
; things like BLE HID or native USB HID.
; ============================================================================

[env:edgehax-s3-pro]
; SWITCHED from plain `platform = espressif32` (the official PlatformIO
; platform). This is the real root cause behind both the earlier component-
; manager crash AND the "driver/i2s_std.h: No such file or directory"
; error. Confirmed, not guessed -- the build log itself showed it:
;   PACKAGES:
;    - framework-arduinoespressif32 @ 3.20017.241212+sha.dcc1105b   (Arduino 3.x)
;    - framework-espidf @ 3.40407.240606 (4.4.7)                    (IDF 4.4.7!)
; The official platformio/platform-espressif32 platform has never finished
; wiring up dual-framework (`framework = arduino, espidf`) mode for
; Arduino-ESP32 3.x -- every official release from 6.3.2 through the
; current 7.0.1 pins dual-framework mode's ESP-IDF side to 4.4.7
; regardless of which Arduino core version it ships (community-tracked
; here: github.com/sivar2311/platform-espressif32-versions; open issue:
; platformio/platform-espressif32#1225, "Arduino 3.x is not officially
; supported by PlatformIO"). IDF 4.4.7 never got the new i2s_std.h driver
; at all (confirmed by checking espressif/esp-idf's v4.4.7 tag directly --
; only the legacy driver/i2s.h exists there), and Arduino-ESP32 3.x's own
; manifest declares `idf: ">=5.3,<6.2"` -- so the official platform was
; handing us a combination that was never a valid pairing to begin with.
;
; pioarduino/platform-espressif32 is the actively-maintained community
; fork created specifically to fix this (used by ESPHome, among others)
; -- it properly pairs Arduino 3.x with a current IDF release for
; dual-framework builds. Pinned to a specific tagged release (not the
; floating `stable` alias) for reproducibility: 55.03.39 = Arduino 3.3.9 /
; ESP-IDF 5.5.4. If a newer pairing is wanted later, release list is at
; github.com/pioarduino/platform-espressif32/releases.
;
; NOTE: this may also make the component-manager vendoring in
; components/ (see components/README.md) unnecessary, since pioarduino
; packages framework-espidf as a proper git checkout and shouldn't hit
; the "git describe fails -> Component 'idf' not found" issue the
; official platform has. Left the vendoring in place regardless -- it's
; self-contained (IDF_COMPONENT_MANAGER=0 + local components/ satisfy
; REQUIRES esp_tinyusb either way) and safer than changing two variables
; at once. Once this platform switch is confirmed working, the vendoring
; can be revisited/removed if truly redundant, but there's no urgency.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
; CHANGED from `board_variant = n16r8`. That was never actually a
; reliable PlatformIO mechanism for this board -- confirmed by finding
; the exact same board hitting this exact same "still shows N8 (8MB, no
; PSRAM)" issue in platformio/platform-espressif32#989 (a real, open
; community issue about this specific board). The board manifest's
; displayed name ("...N8 (8 MB QD, No PSRAM)") is just descriptive text
; from the base board JSON and doesn't update from board_variant --
; worse, in this case the underlying flash_size wasn't actually being
; overridden either, which is why HARDWARE: showed "8MB Flash" for real,
; not just in the cosmetic name string.
;
; Fix: override upload/build flash size directly, which IS the
; confirmed-working mechanism (same board, same fix, in the linked
; issue above, and in sivar2311/ESP32-PlatformIO-Flash-and-PSRAM-
; configurations' N16R8 reference config).
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; CHANGED from `arduino` alone. network_manager.cpp calls ESP-IDF's raw
; tinyusb_net/esp_netif APIs directly (needed for USB-NCM -- see the big
; risk comment at the top of include/network_manager.h for why this can't
; be done through Arduino's USB.h wrapper). Dual-framework mode is what
; makes those IDF headers/components available while keeping Arduino's
; setup()/loop() for everything else. This is the single least-certain
; line in this whole file -- if the build fails specifically on
; tinyusb_net.h / esp_netif.h not being found, this is where to look.
framework = arduino, espidf

; ---- ESP-IDF component for USB-NCM (network_manager.cpp) ----
; RESOLVED (was the single least-certain line in this file): the online
; component manager cannot resolve espressif/esp_tinyusb under PlatformIO
; -- confirmed real failure, not speculation. framework-espidf isn't a git
; checkout, so the manager can't detect the local IDF version, and every
; online dependency's `idf: >=5.0` constraint then fails to match,
; producing repeated "Component 'idf' not found" and a final
; "no versions of idf match >=5.0" solver error. Same failure is reported
; under plain `framework = espidf` too (platformio/platform-espressif32
; #1238, #1633; espressif/arduino-esp32 #10055) -- it's not specific to
; dual-framework mode.
;
; Fix: component manager disabled via extra_scripts below, and
; esp_tinyusb + its own tinyusb dependency vendored locally under
; components/ (PlatformIO auto-discovers anything there, no resolver
; involved). src/idf_component.yml is retired (renamed .unused).
; See components/README.md for what's vendored and the one open risk:
; arduino-esp32's own native-USB stack (usb_hid_manager.cpp's
; ARDUINO_USB_MODE=1 path) already bundles its own tinyusb internally --
; if that collides with this vendored copy at link time (duplicate
; tud_*/dcd_* symbols), that's the next thing to report back with the
; exact linker error.
extra_scripts = pre:disable_component_manager.py

; ---- ESP-IDF sdkconfig defaults (dual-framework mode needs this) ----
; See sdkconfig.defaults for what's in here and why -- confirmed required
; by an actual build failure (CONFIG_FREERTOS_HZ mismatch), not a
; preemptive guess. If further tinyusb_net-specific sdkconfig options
; turn out to be needed once THIS error clears, add them to
; sdkconfig.defaults, not here -- this line just needs to exist once.
board_build.esp-idf.sdkconfig_defaults = sdkconfig.defaults

; ---- Flash / PSRAM -- must match board_variant above ----
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

; ---- Custom partition table (single app partition + LittleFS, see partitions.csv) ----
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; ---- Native USB (ESP32-S3 D+/D- on GPIO19/20) ----
; CDC_ON_BOOT=1 gives you Serial-over-USB for debugging -- this board has
; no separate UART bridge chip, native USB-C is the only path for it.
; USB_MODE=1 is the standard Arduino-ESP32 native USB stack setting.
; NOTE: native USB HID keyboard (usb_hid_manager.cpp) was removed
; entirely -- it and USB-NCM (network_manager.cpp, Dashboard Mode) both
; needed to own the same vendored TinyUSB component's tusb_config.h at
; compile time, and lost that fight to whichever config esp_tinyusb
; supplies. BLE typing (ble_keyboard_manager.cpp) is the only
; credential-typing path now. CDC (this section) is a different TinyUSB
; class than HID was -- no confirmed evidence yet that it hits the same
; conflict, so it's left enabled; if a similar error surfaces against
; USBCDC.cpp specifically, that's the next thing to investigate.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    ; Required for web_manager.cpp's regex routes ("^\/api\/vault\/([0-9]+)$")
    ; and req->pathArg() -- the esphome ESPAsyncWebServer fork compiles
    ; regex route matching out by default (saves flash on projects that
    ; don't need it). Without this flag, those routes silently never
    ; match and every /api/vault/<id> request 404s. This was a genuinely
    ; missing piece, not just a comment -- confirmed against the library's
    ; own README requirement, not something the code alone would reveal
    ; until tested against real hardware.
    -DASYNCWEBSERVER_REGEX=1
    ; Fix for "esp_littlefs.h: No such file or directory" compiling
    ; LittleFS.cpp. This is the exact risk flagged in src/CMakeLists.txt's
    ; esp_littlefs note, now confirmed: Arduino core's own
    ; libraries/LittleFS/src/LittleFS.cpp lives inside a SEPARATE
    ; framework-provided component (not src/), and that component's
    ; REQUIRES list is generated by arduino-esp32/PlatformIO itself --
    ; there's no project-level hook to add esp_littlefs to it the normal
    ; ESP-IDF way (that's exactly the same class of problem
    ; CONFIG_TINYUSB_CDC_ENABLED=n worked around for USBCDC.cpp in
    ; sdkconfig.defaults, except LittleFS is actually used by
    ; duress_manager.cpp/main.cpp, so it can't just be disabled).
    ; A component's REQUIRES list controls include-path *visibility*
    ; only -- it doesn't gate linking, and something in this build
    ; (src/, via src/CMakeLists.txt's REQUIRES esp_littlefs) already
    ; pulls the real component into the link, so the .a will be there
    ; regardless. This just adds its public include dir globally so
    ; every compilation unit -- including Arduino core's -- can find the
    ; header, sidestepping component-level isolation for this one file.
    ; LEAST-CERTAIN LINE: PlatformIO's ESP-IDF integration resolves
    ; build_flags -I paths relative to the project root and forwards
    ; them as global compile options to every component (this is how
    ; -DASYNCWEBSERVER_REGEX=1 above already applies project-wide, not
    ; just to src/) -- but that's inferred from this project's own
    ; working precedent, not independently confirmed against pioarduino's
    ; espidf.py source. If this specific line doesn't clear the error,
    ; check the verbose build log (`pio run -v`) for LittleFS.cpp's
    ; actual compile command and confirm this -I path is present in it.
    ; AP Mode (v5.4): the AP_MODE feature uses ESPAsyncWebServer + DNSServer
    ; + ESPmDNS, all of which are now first-class dependencies (see lib_deps).
    ; The -DASYNCWEBSERVER_REGEX=1 flag above is also required by AP mode
    ; for the /api/vault/<id> regex routes.
    -Icomponents/esp_littlefs/include
    ; Fix for "littlefs/lfs.h: No such file or directory" compiling
    ; esp_littlefs.c and littlefs_esp_part.c. The vendored esp_littlefs
    ; component's CMakeLists.txt declares PRIV_INCLUDE_DIRS src, which
    ; SHOULD make littlefs/lfs.h (living at src/littlefs/lfs.h) visible
    ; to its own source files — but PlatformIO's dual-framework mode
    ; (framework = arduino, espidf) does not properly propagate private
    ; include directories from idf_component_register() for vendored
    ; components under components/. The exact same class of issue as the
    ; -Icomponents/esp_littlefs/include line above (public include dir
    ; for esp_littlefs.h), except this one covers the PRIVATE include
    ; path that the component's own .c files need to find the nested
    ; littlefs submodule headers. Without this, the compiler sees
    ; #include "littlefs/lfs.h" in esp_littlefs.c but has no -I path
    ; that resolves it to components/esp_littlefs/src/littlefs/lfs.h.
    ; Confirmed: lfs.h IS present at that path in the vendored source.
    -Icomponents/esp_littlefs/src

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; ---- Libraries ----
; Adafruit GFX/ILI9341 for the SPI TFT, NimBLE-Arduino for the BLE HID
; keyboard (lighter RAM/flash footprint than the older Bluedroid-based
; BLE stack, and what ble_keyboard_manager was written against).
; ESPAsyncWebServer + AsyncTCP: the dashboard (web_manager.cpp).
; ArduinoJson: request/response bodies for the vault REST API.
; SD, Wire, USB, mbedtls, and driver/i2s are all bundled with the
; Arduino-ESP32 core itself -- no lib_deps entry needed for those.
;
; NOTE: bumped from the originally-drafted ^1.4.1 to ^2.1.0. ble_keyboard_
; manager.cpp calls NimBLEHIDDevice::getInputReport/setPnp/setHidInfo/
; setReportMap/getHidService -- those are the 2.x method names (renamed
; from 1.x's inputReport/pnp/hidInfo/reportMap/hidService in the 2.0
; release). Pinning ^1.4.1 would fail to compile against this code.
; Recommended by ESP32Async's own install docs for reliable dependency
; resolution with this library family.
lib_compat_mode = strict
lib_ldf_mode = chain

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ILI9341 @ ^1.6.1
    h2zero/NimBLE-Arduino @ ^2.1.0
    bblanchon/ArduinoJson @ ^7.1.0
    ; v5.4 AP Mode: AsyncWebServer for the AP-mode vault CRUD webapp.
    ESP32Async/ESPAsyncWebServer @ ^3.2.0
    ESP32Async/AsyncTCP @ ^3.2.4
    ; v5.4.3: QR code generation for the AP-mode WiFi QR display.
    ; ricmoo/QRCode is a pure-C QR encoder (no display dependency) —
    ; we write our own Adafruit_GFX wrapper in qr_display.cpp.
    ricmoo/QRCode @ ^0.0.1
    ; NOTE: WiFi, DNSServer, ESPmDNS are bundled with the Arduino-ESP32
    ; core — no lib_deps entry needed.

; ---- NOTE on XPT2046 touch ----
; display_manager.cpp bit-bangs the XPT2046 directly on T_DO (GPIO41),
; matching the confirmed-working reference implementation -- no touch
; controller library needed.
